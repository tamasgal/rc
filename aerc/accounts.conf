[Work]
source          = maildir://~/Mail/FAU
outgoing        = smtps://tamas.gal%40fau.de@smtp-auth.fau.de
outgoing-cred-cmd = pass FAU | head -n1
default         = INBOX
from            = Tamas Gal <tamas.gal@fau.de>
copy-to         = Sent Items
postpone        = Drafts

[Personal]
source          = maildir://~/Mail/Personal
outgoing        = smtp://tamas.gal%40me.com@smtp.mail.me.com:587
outgoing-cred-cmd = pass icloud_aerc
default         = INBOX
from            = Tamas Gal <tamas.gal@me.com>
copy-to         = Sent Messages
postpone        = Drafts

